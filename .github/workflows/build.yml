# Build cnpg-citus for linux/amd64 and linux/arm64 and publish a manifest list.
#
# Each architecture is built on a runner of that architecture. The alternative,
# one job using QEMU, would work and take hours: this image compiles Citus from
# source and pg_durable through cargo-pgrx, and emulated Rust builds are slow
# enough to hit the job timeout. GitHub's arm64 runners are free for public
# repositories, so there is no reason to emulate.
#
# The build/merge split is the standard multi-arch shape: each job pushes an
# untagged image and reports its digest, and a final job assembles those
# digests into one manifest list. Nothing carries a human-readable tag until
# every architecture has built and passed its smoke test, so a half-published
# tag is not reachable.

name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      citus_version:
        description: Citus version
        default: "14.1.0"
      pg_major:
        description: PostgreSQL major
        default: "17"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PG_MAJOR: ${{ inputs.pg_major || '17' }}
  CITUS_VERSION: ${{ inputs.citus_version || '14.1.0' }}
  PG_DURABLE_VERSION: "0.2.5"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - name: Confirm the runner is the architecture it claims
        # A silent fallback to an amd64 runner would produce two identical
        # images in a manifest list that advertises two architectures, and the
        # arm64 half would fail only on a user's node.
        run: |
          got=$(dpkg --print-architecture)
          echo "runner reports: $got, expected ${{ matrix.arch }}"
          [ "$got" = "${{ matrix.arch }}" ] || exit 1

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        # Pull requests from forks have no package write token; they build and
        # test without publishing.
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: cnpg-citus:ci-${{ matrix.arch }}
          build-args: |
            PG_MAJOR=${{ env.PG_MAJOR }}
            CITUS_VERSION=${{ env.CITUS_VERSION }}
            PG_DURABLE_VERSION=${{ env.PG_DURABLE_VERSION }}
            WITH_DURABLE=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Smoke test
        # Before publishing, not after. Starts a real postmaster, creates every
        # extension and uses it — a distributed table, an hnsw index, a cron
        # job, and the pg_durable worker reaching "runtime started".
        run: |
          docker run --rm --user 26 \
            -e PG_MAJOR=${{ env.PG_MAJOR }} -e WITH_DURABLE=true \
            -v "$PWD/tools/smoke.sh:/smoke.sh:ro" \
            --entrypoint /bin/bash cnpg-citus:ci-${{ matrix.arch }} /smoke.sh

      - name: Push by digest
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            PG_MAJOR=${{ env.PG_MAJOR }}
            CITUS_VERSION=${{ env.CITUS_VERSION }}
            PG_DURABLE_VERSION=${{ env.PG_DURABLE_VERSION }}
            WITH_DURABLE=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      # Not a job output. A matrix job's `outputs` are merged across legs with
      # last-writer-wins, and every leg evaluates every expression — so the leg
      # that did not set `digest-arm64` contributes an empty string for it, and
      # whichever finishes last decides. The digests would be silently empty
      # about half the time. One artifact per architecture has no such race.
      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          echo -n "${{ steps.push.outputs.digest }}" > "/tmp/digests/${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    # Only now does anything acquire a tag people will pull.
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.PG_MAJOR }}-citus${{ env.CITUS_VERSION }}
            type=raw,value=${{ env.PG_MAJOR }},enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=${{ env.PG_MAJOR }}-,format=short

      - name: Create the manifest list
        run: |
          set -euo pipefail
          # Refuse to publish a partial list. Without this an absent digest
          # would produce a single-architecture image under a tag that claims
          # to serve both.
          for arch in amd64 arm64; do
            [ -s "/tmp/digests/$arch" ] || { echo "no digest for $arch"; exit 1; }
          done
          digests=""
          for arch in amd64 arm64; do
            digests="$digests ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@$(cat /tmp/digests/$arch)"
          done
          echo "assembling from:$digests"
          for tag in $(jq -r '.tags[]' <<< '${{ steps.meta.outputs.json }}'); do
            docker buildx imagetools create -t "$tag" $digests
          done

      - name: Verify both architectures resolve
        # A manifest list that advertises an architecture it does not contain
        # is worse than a single-arch image: the pull fails on the node rather
        # than in CI.
        run: |
          set -eu
          tag="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.PG_MAJOR }}-citus${{ env.CITUS_VERSION }}"
          docker buildx imagetools inspect --raw "$tag" | tee /tmp/m.json
          for arch in amd64 arm64; do
            jq -e --arg a "$arch" \
              '[.manifests[] | select(.platform.architecture==$a and .platform.os=="linux")] | length == 1' \
              /tmp/m.json > /dev/null || { echo "missing linux/$arch"; exit 1; }
          done
          echo "both architectures present"
